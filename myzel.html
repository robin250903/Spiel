<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140e09">
<title>Myzel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: Karte (Waldboden von oben) füllt den Platz, Steuerpult rechts; schmal: Pult unten als Blatt.
   Ein einziger Look: nachtdunkle Erde, das Myzel leuchtet. Deshalb kein Hell/Dunkel-Wechsel. */
:root {
  --soil: #140e09;
  --panel: #1d150e;
  --panel-2: #271c13;
  --line: #3b2c1f;
  --ink: #f1e6d0;
  --muted: #a9967b;
  --myc: #f4ead6;
  --n: #e0a65a;      /* Nährstoffe */
  --w: #6cc3ea;      /* Wasser */
  --z: #f08fb4;      /* Zucker */
  --m: #b8a3ff;      /* Mineralien */
  --s: #9fe6b4;      /* Sporen / Erbgut */
  --bad: #ff7d6b;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --label: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--soil); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
[hidden] { display: none !important; }
#app { display: grid; height: 100%; grid-template-columns: 1fr 360px; grid-template-rows: 100%; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.drag { cursor: grabbing; }
#hud {
  position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none;
  background: linear-gradient(to bottom, rgba(20,14,9,.92), rgba(20,14,9,.55) 70%, rgba(20,14,9,0));
}
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px;
  background: rgba(39,28,19,.85); border: 1px solid var(--line); font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap; pointer-events: auto;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; flex: none; }
.chip b { font-weight: 800; font-size: 15px; }
.chip small { color: var(--muted); font-size: 12px; }
.chip.season { gap: 8px; }
.season .bar { width: 46px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; overflow: hidden; }
.season .bar i { display: block; height: 100%; background: var(--myc); }
#hud .sp { flex: 1; }
.iconbtn {
  pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(39,28,19,.85); color: var(--ink); font-size: 15px; cursor: pointer; display: grid; place-items: center; padding: 0;
}
#toasts { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; max-width: min(360px, calc(100% - 24px)); }
.toast {
  background: rgba(39,28,19,.95); border: 1px solid var(--line); border-left: 3px solid var(--s); padding: 8px 12px; border-radius: 6px;
  font-size: 14px; animation: tin .3s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
.toast b { font-family: var(--display); font-weight: 700; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
#panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; padding-top: env(safe-area-inset-top, 0px); }
#tabs button {
  flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 13px 4px 11px;
  font: 700 14px var(--label); letter-spacing: .04em; cursor: pointer; position: relative;
}
#tabs button.on { color: var(--ink); border-bottom-color: var(--myc); }
#tabs button .badge { position: absolute; top: 8px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--s); }
#body { overflow-y: auto; padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; min-height: 0; flex: 1; }
h2 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0; line-height: 1.1; text-wrap: balance; }
h3 { font: 700 13px var(--label); letter-spacing: .08em; color: var(--muted); margin: 0; text-transform: lowercase; }
p { margin: 0; line-height: 1.45; }
.muted { color: var(--muted); }
.tag { display: inline-block; font: 700 12px var(--label); letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.own { color: var(--myc); border-color: rgba(244,234,214,.4); }
.tag.reach { color: var(--s); border-color: rgba(159,230,180,.4); }
.head { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: lining-nums tabular-nums; }
.rows span:nth-child(odd) { color: var(--muted); }
.rows span:nth-child(even) { text-align: right; font-weight: 700; }
.act { display: flex; flex-direction: column; gap: 8px; }
.btn {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 10px 12px;
  font: 700 15px var(--body); cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: rgba(244,234,214,.45); }
.btn:disabled { cursor: default; opacity: .55; }
.btn.primary { background: rgba(244,234,214,.1); border-color: rgba(244,234,214,.45); }
.btn.warn { border-color: rgba(255,125,107,.5); color: var(--bad); }
button:focus-visible { outline: 2px solid var(--myc); outline-offset: 2px; }
.cost { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font-variant-numeric: lining-nums tabular-nums; font-weight: 700; }
.cost span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cost span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .9; }
.cost .no { color: var(--bad) !important; }
.c-N { color: var(--n); } .c-W { color: var(--w); } .c-Z { color: var(--z); } .c-M { color: var(--m); } .c-S { color: var(--s); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: rgba(39,28,19,.45); }
.card.done { opacity: .6; }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card .top b { font-family: var(--display); font-size: 17px; font-weight: 700; }
.card .lvl { font: 700 13px var(--label); color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.prog { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--myc); }
.list { display: flex; flex-direction: column; gap: 10px; }
.goal { border-left: 3px solid var(--s); padding: 8px 12px; background: rgba(159,230,180,.06); border-radius: 0 8px 8px 0; }
.goal h3 { color: var(--s); margin-bottom: 3px; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.switch button { min-width: 64px; }
#modal { position: fixed; inset: 0; background: rgba(10,7,4,.72); display: grid; place-items: center; padding: 16px; z-index: 10; }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
#modal .gains { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: lining-nums tabular-nums; font-weight: 700; font-size: 17px; }
@media (max-width: 820px) {
  #app { grid-template-columns: 100%; grid-template-rows: minmax(0, 1fr) auto; }
  #panel { border-left: 0; border-top: 1px solid var(--line); max-height: 44vh; max-height: 44dvh; }
  #panel.min #body { display: none; }
  #tabs { padding-top: 0; }
  .chip { padding: 4px 8px 4px 7px; }
  .chip b { font-size: 14px; }
  .chip small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="toasts"></div>
  </div>
  <div id="panel">
    <div id="tabs" role="tablist"></div>
    <div id="body"></div>
  </div>
</div>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
'use strict';
// ============================================================================
// Myzel: Ein Pilzgeflecht unter dem Waldboden. Wachse Feld für Feld, zersetze Laub und Holz,
// tausche mit Bäumen Wasser gegen Zucker, entwickle dich weiter und starte per Sporenflug neu.
// Der Fortschritt läuft weiter, während das Spiel geschlossen ist.
// ============================================================================

const N = 45, C = 22, CELL = 34, SEASON_LEN = 100;
const SAVE_KEY = 'myzel.save.v1';
const T = { ERDE: 0, STEIN: 1, LAUB: 2, HOLZ: 3, WASSER: 4, BAUM: 5, MINERAL: 6, KNOCHEN: 7 };
const TYPES = [
  { name: 'Erde', desc: 'Lockerer Waldboden. Auf eigenen Erdfeldern kannst du Knoten und Pilze wachsen lassen.' },
  { name: 'Stein', desc: 'Fels. Nur mit Säure frisst sich dein Myzel hindurch.' },
  { name: 'Laub', desc: 'Herabgefallene Blätter. Dein Myzel zersetzt sie zu Nährstoffen, bis nichts mehr übrig ist.', res: 'N', rate: 1, finite: true, amt: 60 },
  { name: 'Totholz', desc: 'Ein morscher Ast. Gibt viele Nährstoffe und hält lange.', res: 'N', rate: 2.5, finite: true, amt: 450 },
  { name: 'Wasserader', desc: 'Feuchte Erde. Liefert ohne Ende Wasser.', res: 'W', rate: 1.2 },
  { name: 'Baumwurzel', desc: 'Ein Baum. Er gibt dir Zucker und braucht dafür Wasser aus deinem Netz. Stärken kannst du ihn mit Nährstoffen, Wasser und später Mineralien.', res: 'Z' },
  { name: 'Mineralader', desc: 'Gelöste Mineralien sickern durch den Stein. Langsam, aber ohne Ende.', res: 'M', rate: 0.15 },
  { name: 'Knochen', desc: 'Die Reste eines Tieres. Viele Mineralien, bis sie aufgebraucht sind.', res: 'M', rate: 0.45, finite: true, amt: 160 },
];
const RES = {
  N: { name: 'Nährstoffe', short: 'Nährstoffe' },
  W: { name: 'Wasser', short: 'Wasser' },
  Z: { name: 'Zucker', short: 'Zucker' },
  M: { name: 'Mineralien', short: 'Mineralien' },
  S: { name: 'Sporen', short: 'Sporen' },
};
const RES_COL = { N: '#e0a65a', W: '#6cc3ea', Z: '#f08fb4', M: '#b8a3ff', S: '#9fe6b4' };
const SEASONS = [
  { name: 'Frühling', note: 'Hyphen wachsen doppelt so schnell.', tint: 'rgba(120,200,120,0.05)' },
  { name: 'Sommer', note: 'Bäume geben 50 % mehr Zucker, aber es gibt 30 % weniger Wasser.', tint: 'rgba(255,200,90,0.05)' },
  { name: 'Herbst', note: 'Frisches Laub fällt. Zersetzung +20 %.', tint: 'rgba(230,120,40,0.07)' },
  { name: 'Winter', note: 'Schneeschmelze: +40 % Wasser. Zersetzung −40 %.', tint: 'rgba(140,180,255,0.07)' },
];
const BLD = {
  1: { name: 'Zersetzerknoten', desc: 'Laub, Totholz und Knochen bis zu 2 Felder weit werden 50 % schneller zersetzt.' },
  2: { name: 'Fruchtkörper', desc: 'Ein Pilz wächst aus dem Boden und bildet Sporen.' },
};

// ---- Hilfen ----------------------------------------------------------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(n) {
  n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}
function makeNoise(rng, scale) {
  const g = Math.ceil(N / scale) + 2, v = [];
  for (let i = 0; i < g * g; i++) v.push(rng());
  return (x, y) => {
    const fx = x / scale, fy = y / scale, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy;
    tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const a = v[iy * g + ix], b = v[iy * g + ix + 1], c = v[(iy + 1) * g + ix], d = v[(iy + 1) * g + ix + 1];
    return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  };
}
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n < 10) s = (Math.floor(n * 10) / 10).toFixed(1);
  else if (n < 1000) s = String(Math.floor(n));
  else {
    const u = ['k', 'M', 'Mrd', 'Bio']; let i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    s = (n < 100 ? (Math.floor(n * 10) / 10).toFixed(1) : String(Math.floor(n))) + ' ' + u[i];
  }
  return (neg ? '−' : '') + s.replace('.', ',');
}
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + ' s';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), mm = m % 60;
  return h + ' h' + (mm ? ' ' + mm + ' min' : '');
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const neighbors4 = i => {
  const x = i % N, y = (i / N) | 0, out = [];
  if (x > 0) out.push(i - 1); if (x < N - 1) out.push(i + 1);
  if (y > 0) out.push(i - N); if (y < N - 1) out.push(i + N);
  return out;
};

// ---- Spielstand ------------------------------------------------------------
let S = null;

const UPS = [
  { id: 'enzyme', name: 'Enzyme', max: 10, desc: () => 'Laub, Totholz und Knochen zersetzen sich 50 % schneller.',
    cost: l => ({ N: 25 * Math.pow(2.3, l) }), vis: () => true },
  { id: 'hyphen', name: 'Feine Hyphen', max: 8, desc: () => 'Wachsen kostet 15 % weniger Nährstoffe.',
    cost: l => ({ N: 35 * Math.pow(2.4, l) }), vis: () => true },
  { id: 'tempo', name: 'Schnelles Wachstum', max: 5, desc: () => 'Hyphen wachsen 30 % schneller, und ein Faden mehr kann gleichzeitig wachsen.',
    cost: l => ({ N: 40 * Math.pow(2.6, l) }), vis: () => S.ever.N >= 40 },
  { id: 'kapillar', name: 'Kapillaren', max: 8, desc: () => 'Wasseradern liefern 50 % mehr Wasser.',
    cost: l => ({ Z: 20 * Math.pow(2.2, l) }), vis: () => S.ever.Z > 0 },
  { id: 'symbiose', name: 'Symbiose', max: 10, desc: () => 'Bäume geben 40 % mehr Zucker.',
    cost: l => ({ Z: 30 * Math.pow(2.3, l), M: l >= 2 ? 6 * Math.pow(2, l - 2) : 0 }), vis: () => S.ever.Z > 0 },
  { id: 'sinne', name: 'Chemische Sinne', max: 3, desc: () => 'Du spürst ein Feld weiter in die Erde.',
    cost: l => ({ Z: 60 * Math.pow(3.5, l) }), vis: () => S.ever.Z > 0 },
  { id: 'saeure', name: 'Säure', max: 2, desc: l => l === 0 ? 'Dein Myzel frisst sich durch Stein. Kostet 5× so viel wie normales Wachsen.' : 'Stein kostet nur noch 2,5× so viel.',
    cost: l => l === 0 ? { Z: 300 } : { Z: 2500, M: 150 }, vis: () => S.ever.Z > 0 },
  { id: 'gestein', name: 'Gesteinslösung', max: 8, desc: () => 'Mineralien fließen 30 % schneller.',
    cost: l => ({ Z: 50 * Math.pow(2.4, l) }), vis: () => S.ever.M > 0 },
  { id: 'spitzen', name: 'Wachstumsspitzen', max: 6, desc: l => `Dein Myzel wächst von selbst zum nächsten Fundort, alle ${autoInt(l + 1)} s.`,
    cost: l => ({ Z: 400 * Math.pow(3, l), M: l ? 40 * Math.pow(3, l - 1) : 0 }), vis: () => S.ever.Z >= 100 },
  { id: 'ruhe', name: 'Winterruhe', max: 5, desc: () => 'Du sammelst 2 Stunden länger, während das Spiel zu ist.',
    cost: l => ({ Z: 100 * Math.pow(2.5, l) }), vis: () => S.ever.Z > 0 },
  { id: 'frucht', name: 'Fruchtkörper', max: 1, desc: () => 'Pilze wachsen aus deinem Netz und bilden Sporen. Mit Sporen kannst du neu starten und dauerhafte Boni kaufen.',
    cost: () => ({ Z: 2500, M: 300 }), vis: () => S.ever.M > 0 },
  { id: 'pilz', name: 'Kräftige Fruchtkörper', max: 8, desc: () => 'Fruchtkörper bilden 50 % mehr Sporen.',
    cost: l => ({ Z: 4000 * Math.pow(3, l) }), vis: () => S.up.frucht > 0 },
];
const ERBS = [
  { id: 'kraft', name: 'Kräftiges Erbe', max: 20, desc: () => '+25 % auf alle Erträge.', cost: l => l + 1 },
  { id: 'vorrat', name: 'Sporenvorrat', max: 5, desc: l => `Starte mit ${fmt(startN(l + 1))} Nährstoffen.`, cost: l => 2 * (l + 1) },
  { id: 'wissen', name: 'Uraltes Wissen', max: 3, desc: () => 'Enzyme und Feine Hyphen starten eine Stufe höher.', cost: l => 3 * (l + 1) },
  { id: 'wald', name: 'Waldgedächtnis', max: 3, desc: () => 'Bäume starten eine Stufe stärker.', cost: l => 4 * (l + 1) },
  { id: 'boden', name: 'Fruchtbarer Boden', max: 3, desc: () => 'Neue Wälder haben 15 % mehr Fundorte.', cost: l => 3 * (l + 1) },
  { id: 'spitze', name: 'Angeborene Spitzen', max: 2, desc: () => 'Starte mit einer Stufe Wachstumsspitzen.', cost: l => 6 * (l + 1) },
];
const startN = l => 20 + [0, 120, 500, 1800, 6000, 20000][l];
const autoInt = l => Math.max(3, Math.round(20 * Math.pow(0.72, l - 1)));

function countOwned() { let c = 0; for (let i = 0; i < N * N; i++) if (S.own[i] === 1) c++; return c; }
function countWhere(fn) { let c = 0; for (let i = 0; i < N * N; i++) if (fn(i)) c++; return c; }
const MILES = [
  { id: 'c5', name: 'Erste Fäden', desc: 'Besitze 5 Felder', goal: () => [D.owned, 5], reward: { N: 25 } },
  { id: 'laub3', name: 'Laubfresser', desc: 'Zersetze 3 Haufen komplett', goal: () => [S.stats.depleted, 3], reward: { N: 60 } },
  { id: 'wasser', name: 'Durst gestillt', desc: 'Verbinde eine Wasserader', goal: () => [D.water, 1], reward: { N: 80 } },
  { id: 'baum', name: 'Baumfreundschaft', desc: 'Verbinde eine Baumwurzel', goal: () => [D.trees.length, 1], reward: { Z: 15 } },
  { id: 'c25', name: 'Wurzelwerk', desc: 'Besitze 25 Felder', goal: () => [D.owned, 25], reward: { Z: 30 } },
  { id: 'knochen', name: 'Fundstück', desc: 'Sammle 20 Mineralien', goal: () => [S.runTotal.M, 20], reward: { Z: 40 } },
  { id: 'z500', name: 'Süßes Leben', desc: 'Sammle insgesamt 500 Zucker', goal: () => [S.runTotal.Z, 500], reward: { M: 20 } },
  { id: 'stein', name: 'Steinbrecher', desc: 'Wachse durch Stein', goal: () => [S.stats.stone, 1], reward: { Z: 80 } },
  { id: 'trees3', name: 'Waldnetz', desc: 'Verbinde 3 Bäume', goal: () => [D.trees.length, 3], reward: { Z: 200 } },
  { id: 'baum5', name: 'Alter Riese', desc: 'Bringe einen Baum auf Stufe 5', goal: () => [D.maxTree, 5], reward: { Z: 300 } },
  { id: 'c100', name: 'Weites Myzel', desc: 'Besitze 100 Felder', goal: () => [D.owned, 100], reward: { Z: 500, M: 50 } },
  { id: 'frucht1', name: 'Erster Pilz', desc: 'Lass einen Fruchtkörper wachsen', goal: () => [D.fruits, 1], reward: { Z: 800 } },
  { id: 'trees8', name: 'Herz des Waldes', desc: 'Verbinde 8 Bäume', goal: () => [D.trees.length, 8], reward: { M: 300 } },
  { id: 'c250', name: 'Unterirdisches Reich', desc: 'Besitze 250 Felder', goal: () => [D.owned, 250], reward: { Z: 5000, M: 500 } },
];

function newState(meta) {
  const seed = (Math.random() * 1e9) | 0;
  const s = {
    v: 1, seed, t: Date.now(), st: 0,
    res: { N: 0, W: 0, Z: 0, M: 0, S: 0 },
    ever: { N: 0, W: 0, Z: 0, M: 0, S: 0 },
    runTotal: { N: 0, W: 0, Z: 0, M: 0, S: 0 },
    type: [], amt: [], own: [], prog: [], par: [], bld: [], lvl: [], rev: [],
    up: {}, miles: {}, stats: { depleted: 0, stone: 0, grown: 0 }, autoOn: true, autoT: 5,
    meta: meta || { erb: {}, pts: 0, runs: 0, best: 0 },
  };
  for (const u of UPS) s.up[u.id] = 0;

// ---- Abgeleitete Daten -----------------------------------------------------

function cellPanel(i) {
  const t = S.type[i], info = TYPES[t], x = i % N, y = (i / N) | 0;
  if (!S.rev[i]) return `<div class="head"><span class="tag">unerforscht</span><h2>Dunkle Erde</h2><p class="muted">Was hier liegt, spürst du erst, wenn dein Myzel näher wächst.</p></div><button class="btn" data-act="desel"><span>Zur Übersicht</span></button>`;
  const own = S.own[i];
  let tag = own === 1 ? '<span class="tag own">dein Netz</span>' : own === 2 ? '<span class="tag own">wächst</span>'
    : D.frontier.has(i) ? '<span class="tag reach">erreichbar</span>' : '<span class="tag">außer Reichweite</span>';
  if (i === C * N + C) tag = '<span class="tag own">Ursprung</span>';
  let title = info.name;
  if (t === T.BAUM) title += ` · Stufe ${S.lvl[i]}`;
  let rows = '', act = '';
  const m = mults();
  if (info.finite) rows += `<span>Übrig</span><span id="${U(el => el.innerHTML = `<span class="c-${info.res}">${fmt(S.amt[i])} ${RES[info.res].name}</span>`)}"></span>`;
  if (own === 1) {
    if (t === T.LAUB || t === T.HOLZ || t === T.KNOCHEN)
      rows += `<span>Ertrag</span><span id="${U(el => el.innerHTML = `<span class="c-${info.res}">+${fmt(info.rate * (t === T.KNOCHEN ? mults().M : mults().N) * D.boost[i])}/s</span>`)}"></span>`;
    if (t === T.WASSER) rows += `<span>Ertrag</span><span class="c-W">+${fmt(info.rate * m.W)}/s</span>`;
    if (t === T.MINERAL) rows += `<span>Ertrag</span><span class="c-M">+${fmt(info.rate * m.M)}/s</span>`;
    if (t === T.BAUM) {
      rows += `<span>Zucker</span><span id="${U(el => el.innerHTML = `<span class="c-Z">+${fmt(S.lvl[i] * 0.5 * mults().Z * D.thirst)}/s</span>`)}"></span>`;
      rows += `<span>Wasserbedarf</span><span class="c-W">${fmt(S.lvl[i] * 0.8)}/s</span>`;
      if (S.lvl[i] < 15) act += actBtn(`Baum stärken auf Stufe ${S.lvl[i] + 1}`, 'tree', i, () => treeCost(i), null, 'primary');
    }
    if (D.boost[i] > 1 && (t === T.LAUB || t === T.HOLZ || t === T.KNOCHEN)) rows += `<span>Zersetzerknoten</span><span>+${Math.round((D.boost[i] - 1) * 100)} %</span>`;
    if (S.bld[i]) {
      title = BLD[S.bld[i]].name;
      rows += S.bld[i] === 2 ? `<span>Sporen</span><span class="c-S">+${fmt(10.8 * (1 + 0.5 * S.up.pilz))}/h</span>` : '';
    }
    if (t === T.ERDE && !S.bld[i] && i !== C * N + C) {
      act += actBtn('Zersetzerknoten anlegen', 'bld', 1, () => bldCost(1));
      act += `<p class="muted" style="font-size:13px">${BLD[1].desc}</p>`;
      if (S.up.frucht) { act += actBtn('Fruchtkörper wachsen lassen', 'bld', 2, () => bldCost(2), null, 'primary'); act += `<p class="muted" style="font-size:13px">Bildet etwa 11 Sporen pro Stunde.</p>`; }
    }
  } else if (own === 2) {
    rows += `<span>Wachstum</span><span id="${U(el => el.textContent = Math.floor(S.prog[i] * 100) + ' %')}"></span>`;
  } else if (D.frontier.has(i)) {
    if (t === T.STEIN && !S.up.saeure) act += `<p class="muted">Hier kommst du erst mit <b>Säure</b> weiter (Evolution).</p>`;
    else { act += actBtn('Hierhin wachsen', 'grow', i, () => growCost(i), () => canGrow(i) && D.growing.length < maxPar(), 'primary');
      act += `<p class="muted" style="font-size:13px" id="${U(el => el.textContent = D.growing.length >= maxPar() ? `Es wachsen schon ${D.growing.length} Fäden gleichzeitig. Warte kurz oder entwickle Schnelles Wachstum.` : '')}"></p>`; }
    if (TYPES[t].res) {
      const r = TYPES[t].res;
      const preview = t === T.BAUM ? 'Gibt Zucker gegen Wasser' : `+${fmt((TYPES[t].rate || 0) * (r === 'N' ? m.N : r === 'W' ? m.W : m.M))} ${RES[r].name}/s`;
      rows += `<span>Wenn verbunden</span><span class="c-${r}">${preview}</span>`;
    }
  }
  const desc = S.bld[i] ? BLD[S.bld[i]].desc : i === C * N + C ? 'Hier hat alles begonnen. Alles, was dein Netz sammelt, fließt hierher.' : info.desc;
  return `<div class="head">${tag}<h2>${title}</h2><p class="muted">${desc}</p></div>
    ${rows ? `<div class="rows">${rows}</div>` : ''}
    ${act ? `<div class="act">${act}</div>` : ''}
    <button class="btn" data-act="desel"><span>Zur Übersicht</span></button>`;
}
function evoPanel() {
  const vis = UPS.filter(u => u.vis());
  const cards = vis.map(u => {
    const l = S.up[u.id], maxed = l >= u.max;
    return `<div class="card${maxed ? ' done' : ''}">
      <div class="top"><b>${u.name}</b><span class="lvl">${u.max > 1 ? `${l} / ${u.max}` : maxed ? 'erforscht' : ''}</span></div>
      <p class="muted">${u.desc(Math.min(l, u.max - 1))}</p>
      ${maxed ? '' : actBtn(l ? 'Weiter entwickeln' : 'Entwickeln', 'up', u.id, () => u.cost(S.up[u.id]))}
    </div>`;
  }).join('');
  const hidden = UPS.length - vis.length;
  return `<div class="head"><h2>Evolution</h2><p class="muted">Dein Myzel lernt dazu. Neue Entwicklungen tauchen auf, sobald du neue Stoffe entdeckst.</p></div>
    <div class="list">${cards}</div>
    ${hidden ? `<p class="muted">${hidden} weitere Entwicklung${hidden > 1 ? 'en' : ''} noch verborgen.</p>` : ''}`;
}
function milesPanel() {
  const done = MILES.filter(m => S.miles[m.id]).length;
  return `<div class="head"><h2>Erfolge</h2><p class="muted">${done} von ${MILES.length} in diesem Wald. Nach einem Sporenflug kannst du sie neu verdienen.</p></div>
  <div class="list">${MILES.map(ms => {
    const d = S.miles[ms.id];
    return `<div class="card${d ? ' done' : ''}"><div class="top"><b>${ms.name}</b><span class="lvl">${d ? 'geschafft' : ''}</span></div>
      <p class="muted">${ms.desc} · Belohnung: ${rewardText(ms.reward)}</p>
      ${d ? '' : `<div class="prog"><i id="${U(el => { const [v, g] = ms.goal(); el.style.width = clamp(v / g, 0, 1) * 100 + '%'; })}"></i></div>`}</div>`;
  }).join('')}</div>`;
}
let confirmFlight = false, confirmReset = false;
function sporenPanel() {
  const meta = S.meta;
  const erbCards = ERBS.map(e => {
    const l = meta.erb[e.id] || 0, maxed = l >= e.max;
    const id = U(el => { el.disabled = maxed || meta.pts < e.cost(l); });
    return `<div class="card${maxed ? ' done' : ''}"><div class="top"><b>${e.name}</b><span class="lvl">${l} / ${e.max}</span></div>
      <p class="muted">${e.desc(l)}</p>
      ${maxed ? '' : `<button class="btn" id="${id}" data-act="erb" data-arg="${e.id}"><span>Erwerben</span><span class="cost"><span class="c-S">${e.cost(l)} Erbgut</span></span></button>`}</div>`;
  }).join('');
  return `<div class="head"><h2>Sporenflug</h2><p class="muted">Deine Fruchtkörper entlassen ihre Sporen in den Wind. Du beginnst in einem neuen Wald von vorn, aber dein Erbgut bleibt und macht dich dauerhaft stärker.</p></div>
  <div class="rows">
    <span>Gesammelte Sporen</span><span class="c-S" id="${U(el => el.textContent = fmt(S.res.S))}"></span>
    <span>Erbgut aus Sporen (3 : 1)</span><span class="c-S" id="${U(el => el.textContent = '+' + Math.floor(S.res.S / 3))}"></span>
    <span>Bonus für Netzgröße (je 25 Felder)</span><span class="c-S" id="${U(el => el.textContent = '+' + Math.floor(D.owned / 25))}"></span>
    <span>Erbgut beim Sporenflug</span><span class="c-S" id="${U(el => el.textContent = sporeGain())}"></span>
    <span>Bisherige Sporenflüge</span><span>${meta.runs}</span>
  </div>
  <button class="btn ${confirmFlight ? 'warn' : 'primary'}" data-act="flight" id="${U(el => { el.disabled = !D.fruits || sporeGain() < 1; })}"><span>${confirmFlight ? 'Wirklich? Dieser Wald wird zurückgesetzt.' : 'Sporenflug starten'}</span><span class="cost"><span class="c-S">+${sporeGain()} Erbgut</span></span></button>
  ${!D.fruits ? '<p class="muted">Dafür brauchst du mindestens einen Fruchtkörper.</p>' : ''}
  <div class="head"><h3>erbgut · ${meta.pts} verfügbar</h3></div>
  <div class="list">${erbCards}</div>
  <button class="btn warn" data-act="reset" style="margin-top:12px"><span>${confirmReset ? 'Wirklich alles löschen, auch das Erbgut?' : 'Spielstand komplett löschen'}</span></button>`;
}

bodyEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  audio();
  const act = b.dataset.act, arg = b.dataset.arg;
  if (act !== 'flight') confirmFlight = false;
  if (act !== 'reset') confirmReset = false;
  if (act === 'grow') doGrow(+arg);
  else if (act === 'desel') { sel = -1; buildPanel(); }
  else if (act === 'tree') {
    const i = +arg, c = treeCost(i);
    if (!canAfford(c)) return;
    pay(c); S.lvl[i]++; D.maxTree = Math.max(D.maxTree, S.lvl[i]); sfx.buy(); buildPanel();
  } else if (act === 'bld') {
    const b2 = +arg, c = bldCost(b2);
    if (!canAfford(c) || S.type[sel] !== T.ERDE || S.bld[sel] || S.own[sel] !== 1) return;
    pay(c); S.bld[sel] = b2; rebuildAll(); sfx.buy(); buildPanel();
  } else if (act === 'up') {
    const u = UPS.find(x => x.id === arg), c = u.cost(S.up[u.id]);
    if (!canAfford(c) || S.up[u.id] >= u.max) return;
    pay(c); S.up[u.id]++; sfx.buy();
    if (u.id === 'sinne') revealAll();
    if (u.id === 'saeure') rebuildAll();
    if (u.id === 'spitzen') S.autoT = Math.min(S.autoT, 2);
    if (u.id === 'frucht') toast('<b>Fruchtkörper erforscht.</b> Wähle ein eigenes Erdfeld, um einen Pilz wachsen zu lassen.');
    buildPanel();
  } else if (act === 'auto') { S.autoOn = !S.autoOn; buildPanel(); }
  else if (act === 'erb') {
    const e2 = ERBS.find(x => x.id === arg), l = S.meta.erb[arg] || 0;
    if (l >= e2.max || S.meta.pts < e2.cost(l)) return;
    S.meta.pts -= e2.cost(l); S.meta.erb[arg] = l + 1; sfx.buy(); buildPanel();
  } else if (act === 'flight') {
    if (!confirmFlight) { confirmFlight = true; buildPanel(); return; }
    confirmFlight = false;
    const g = sporeGain(), meta = S.meta;
    meta.pts += g; meta.runs++; meta.best = Math.max(meta.best, D.owned);
    startRun(meta); sel = -1; tab = 'sporen';
    drawAllTerrain(); centerCam(); save(); buildPanel(); sfx.chime();
    toast(`<b>Sporenflug!</b> +${g} Erbgut. Ein neuer Wald wartet.`);
  } else if (act === 'reset') {
    if (!confirmReset) { confirmReset = true; buildPanel(); return; }
    confirmReset = false;
    store.del(SAVE_KEY); startRun(null); sel = -1; tab = 'feld'; drawAllTerrain(); centerCam(); save(); buildPanel();
  }
});
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (window.matchMedia('(max-width: 820px)').matches && b.dataset.tab === tab) { panelEl.classList.toggle('min'); return; }
  panelEl.classList.remove('min');
  confirmFlight = false; confirmReset = false;
  setTab(b.dataset.tab);
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.closest('[data-act="closeModal"]') || e.target.id === 'modal') closeModal(); });
function openModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').hidden = false; }
function closeModal() { document.getElementById('modal').hidden = true; }

function toast(html) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = html;
  const box = document.getElementById('toasts'); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 5200);
}

function buildHud() {
  hudEl.innerHTML = ['N', 'W', 'Z', 'M', 'S'].map(k =>
    `<span class="chip" id="chip${k}" title="${RES[k].name}"><span class="dot" style="background:${RES_COL[k]}"></span><b id="v${k}"></b><small id="r${k}"></small></span>`).join('')
    + `<span class="chip season" title="Jahreszeit"><b id="seasonName"></b><span class="bar"><i id="seasonBar"></i></span></span><span class="sp"></span>`
    + `<button class="iconbtn" id="bMute" aria-label="Ton an oder aus">${muted ? '🔇' : '🔊'}</button>`;
  document.getElementById('bMute').onclick = () => { muted = !muted; store.set('myzel.muted', muted ? '1' : '0'); document.getElementById('bMute').textContent = muted ? '🔇' : '🔊'; audio(); };
}
function updHud() {
  for (const k of ['N', 'W', 'Z', 'M', 'S']) {
    const chip = document.getElementById('chip' + k);
    chip.hidden = !(S.ever[k] > 0 || k === 'N');
    document.getElementById('v' + k).textContent = fmt(S.res[k]);
    const r = D.rates[k];
    document.getElementById('r' + k).textContent = Math.abs(r) >= 0.05 ? (r > 0 ? '+' : '') + fmt(r) + '/s' : '';
  }
  document.getElementById('seasonName').textContent = SEASONS[season()].name;
  document.getElementById('seasonBar').style.width = (S.st % SEASON_LEN) / SEASON_LEN * 100 + '%';
  const anyUp = UPS.some(u => u.vis() && S.up[u.id] < u.max && canAfford(u.cost(S.up[u.id])));
  if (anyUp !== D.newUp && tab !== 'evo') { D.newUp = anyUp; buildTabs(); }
}
function centerCam() {
  cam.x = (C + 0.5) * CELL; cam.y = (C + 0.5) * CELL;
  cam.z = clamp(Math.min(W, H) / (CELL * 9), 0.9, 1.6);
}

// ---- Hauptschleife ---------------------------------------------------------
let last = performance.now(), uiT = 0, saveT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 2) { catchUp(dt, dt > 60); buildPanel(); dt = 0; }
  dt = Math.min(dt, 0.1);
  if (dt > 0) tick(dt);
  // Impulse spawnen
  for (const i of D.prodList) {
    const t = S.type[i], res = S.bld[i] === 2 ? 'S' : TYPES[t].res;
    if (res && Math.random() < dt * 0.5) spawnPulse(i, res);
  }
  for (const i of D.trees) if (Math.random() < dt * 0.4 * D.thirst) spawnPulse(i, 'Z');
  render(dt, ts / 1000);
  uiT -= dt; saveT -= dt;
  if (uiT <= 0) { uiT = 0.25; updHud(); runUpd(); if (D.panelStale) { D.panelStale = false; buildPanel(); } }
  if (saveT <= 0) { saveT = 5; save(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else last = performance.now() - Math.min(Date.now() - S.t, 1e9); });
addEventListener('pagehide', save);

// ---- Start -----------------------------------------------------------------
resize();
const loaded = load();
if (!loaded) startRun(null);
drawAllTerrain();
centerCam();
buildHud();
if (loaded) catchUp((Date.now() - S.t) / 1000, true);
else toast('<b>Ein Sporenkorn keimt.</b> Tippe ein gestricheltes Feld an, um zu wachsen.');
buildPanel();
updHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
